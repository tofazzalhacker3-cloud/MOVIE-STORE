{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="banner" id="banner">
  <div class="banner-track" id="bannerTrack"></div>
  <button class="banner-arrow prev" id="bannerPrev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
  <button class="banner-arrow next" id="bannerNext" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
  <div class="banner-dots" id="bannerDots"></div>
</div>
<div id="homeRows"></div>
{% endblock %}
{% block scripts %}
<script>
const ROWS = [
  ["Trending", "4516404531735022304"],
  ["Trending in Cinema", "5692654647815587592"],
  ["Bollywood", "414907768299210008"],
  ["South Indian", "3859721901924910512"],
  ["Hollywood", "8019599703232971616"],
  ["Top Series This Week", "4741626294545400336"],
  ["Anime", "8434602210994128512"],
  ["Korean Drama", "7878715743607948784"],
];

let BANNER = null;
function startCarousel() {
  stopCarousel();
  BANNER = setInterval(() => goSlide(1), 5000);
}
function stopCarousel() { if (BANNER) clearInterval(BANNER); BANNER = null; }

let slideCur = 0, slideCount = 0;
function goSlide(dir) {
  if (!slideCount) return;
  slideCur = (slideCur + dir + slideCount) % slideCount;
  document.getElementById("bannerTrack").style.transform = `translateX(-${slideCur * 100}%)`;
  document.querySelectorAll("#bannerDots span").forEach((d, i) => d.classList.toggle("active", i === slideCur));
}

(async () => {
  const track = document.getElementById("bannerTrack");
  const dots = document.getElementById("bannerDots");
  try {
    const d = await api("/home?category=4516404531735022304&perPage=10");
    const items = (d.items || []).filter(i => i.coverUrl);
    if (!items.length) { document.getElementById("banner").style.display = "none"; return; }
    slideCount = items.length;
    track.innerHTML = items.map(i => {
      const isTv = i.type === 2;
      return `<div class="banner-slide">
        <div class="banner-bg" style="background-image:url('${i.coverUrl || ""}')"></div>
        <img class="banner-img" src="${i.coverUrl || ""}" alt="" loading="eager">
        <div class="banner-shade"></div>
        <div class="banner-body">
          <span class="banner-type ${isTv ? "badge-tv" : "badge-mv"}">${isTv ? '<i class="fa-solid fa-tv"></i> Series' : '<i class="fa-solid fa-film"></i> Movie'}</span>
          <h2>${i.title || "Untitled"}</h2>
          <div class="banner-meta">
            ${i.releaseDate ? `<span><i class="fa-solid fa-calendar"></i> ${(i.releaseDate || "").slice(0, 4)}</span>` : ""}
            ${i.imdbRating ? `<span class="star"><i class="fa-solid fa-star"></i> ${i.imdbRating}</span>` : ""}
            ${i.genre ? `<span>${i.genre.split(",").slice(0, 3).join(", ")}</span>` : ""}
            ${i.duration ? `<span><i class="fa-solid fa-clock"></i> ${i.duration}</span>` : ""}
          </div>
          <div class="banner-actions">
            <a href="/details/${i.id}" class="btn btn-glow btn-lg btn-icon"><i class="fa-solid fa-circle-info"></i> See Details</a>
          </div>
        </div>
      </div>`;
    }).join("");
    dots.innerHTML = items.map((_, i) => `<span class="${i === 0 ? "active" : ""}" onclick="goSlideTo(${i})"></span>`).join("");
    const banner = document.getElementById("banner");
    banner.addEventListener("mouseenter", stopCarousel);
    banner.addEventListener("mouseleave", startCarousel);
    document.getElementById("bannerPrev").onclick = (e) => { e.stopPropagation(); goSlide(-1); };
    document.getElementById("bannerNext").onclick = (e) => { e.stopPropagation(); goSlide(1); };
    window.goSlideTo = (i) => { slideCur = i; goSlide(0); };
    startCarousel();
  } catch (e) {
    document.getElementById("banner").style.display = "none";
  }
})();

(async () => {
  const host = document.getElementById("homeRows");
  for (const [name, cat] of ROWS) {
    const sec = document.createElement("section");
    sec.innerHTML = `<div class="row-title"><i class="fa-solid fa-fire" style="color:var(--grad2)"></i> ${name}
      <a class="see-all" href="/browse?category=${cat}">See All <i class="fa-solid fa-arrow-right"></i></a>
    </div><div class="row">${skeletonRow()}</div>`;
    host.appendChild(sec);
    const grid = sec.querySelector(".row");
    try {
      const d = await api(`/home?category=${cat}&perPage=10`);
      grid.innerHTML = d.items.map((it, i) => cardHtml(it, i)).join("") || '<div class="empty">No items</div>';
    } catch (e) {
      grid.innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><br>Failed to load</div>';
    }
  }
})();
document.getElementById("navSearchBtn").addEventListener("click", () => {
  const q = document.getElementById("navSearch").value.trim();
  if (q) location.href = "/search?q=" + encodeURIComponent(q);
});
document.getElementById("navSearch").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("navSearchBtn").click();
});
</script>
{% endblock %}
