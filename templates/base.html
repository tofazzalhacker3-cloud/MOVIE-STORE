<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}MOVIESTORE{% endblock %} | MOVIESTORE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<div class="bg-glow"></div>
<nav class="navbar">
  <a href="/" class="logo"><span class="logo-badge"><i class="fa-solid fa-clapperboard"></i></span>MOVIE<span class="grad">STORE</span></a>
  <div class="nav-search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input id="navSearch" type="text" placeholder="Search movies, series, anime..." autocomplete="off">
    <button id="navSearchBtn" class="btn btn-grad btn-sm">Search</button>
  </div>
  <div class="nav-links">
    <a href="/" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
  </div>
</nav>

<main class="container">
{% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="footer-brand"><span class="logo-badge"><i class="fa-solid fa-clapperboard"></i></span> MOVIE<span class="grad">STORE</span></div>
  <p>Stream &amp; download movies, series and anime</p>
  <p class="dev">Developed by <span class="grad">Tofazzal Hossain</span> <i class="fa-solid fa-heart"></i></p>
</footer>

<div id="modal" class="modal hidden">
  <div class="modal-box" id="modalBox">
    <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
const DEVELOPER = "Tofazzal Hossain";
async function api(path) {
  const r = await fetch(path, { headers: { "Accept": "application/json" } });
  const j = await r.json();
  if (j.code !== 0) throw new Error(j.message || "API error");
  return j.data;
}
function fmtBytes(n) {
  if (!n) return "";
  const v = parseFloat(n);
  if (v > 1e9) return (v / 1e9).toFixed(2) + " GB";
  if (v > 1e6) return (v / 1e6).toFixed(0) + " MB";
  return v + " B";
}
function toast(msg, ok = true) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + (ok ? "show" : "show err");
  setTimeout(() => { t.className = "toast hidden"; }, 2600);
}
function openModal(html) {
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal() {
  document.getElementById("modal").classList.add("hidden");
}
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});
function cardHtml(i, idx = 0) {
  const isTv = i.type === 2;
  return `<div class="card" style="animation-delay:${Math.min(idx, 12) * 55}ms" onclick="location.href='/details/${i.id}'">
    <div class="card-poster" style="background-image:url('${i.coverUrl || ''}')">
      <span class="badge ${isTv ? 'badge-tv' : 'badge-mv'}">${isTv ? '<i class="fa-solid fa-tv"></i>' : '<i class="fa-solid fa-film"></i>'}</span>
      ${i.imdbRating ? `<span class="badge-rating"><i class="fa-solid fa-star"></i> ${i.imdbRating}</span>` : ''}
      ${i.duration ? `<span class="badge-dur"><i class="fa-solid fa-clock"></i> ${i.duration}</span>` : ''}
    </div>
    <div class="card-info">
      <div class="card-title">${i.title || 'Untitled'}</div>
      <div class="card-meta">${i.genre ? i.genre.split(',').slice(0,2).join(' • ') : ''}</div>
    </div>
  </div>`;
}
function skeletonRow(n = 8) {
  return Array.from({length: n}, () => '<div class="skel skel-card"></div>').join('');
}
const LAN_MAP = {
  es: "Español", esla: "Español (Latin America)", ptbr: "Português (BR)", pt: "Português",
  en: "English", hi: "Hindi", ta: "தமிழ்", te: "తెలుగు", zh: "中文", ja: "日本語", ko: "한국어",
  fr: "Français", de: "Deutsch", it: "Italiano", ru: "Русский", ar: "العربية", bn: "বাংলা",
  id: "Bahasa Indonesia", th: "ไทย", vi: "Tiếng Việt", tr: "Türkçe", ur: "اردو",
  ml: "മലയാളം", kn: "ಕನ್ನಡ", pa: "ਪੰਜਾਬੀ", gu: "ગુજરાતી"
};
function dubName(d) {
  let n = (d.lanName || "").trim();
  if (!n) {
    const c = (d.lanCode || "").toLowerCase().replace("-", "");
    return LAN_MAP[c] || "";
  }
  const m = n.match(/^([a-z]{2,6})\s+dub$/i);
  if (m && LAN_MAP[m[1].toLowerCase()]) return LAN_MAP[m[1].toLowerCase()] + " dub";
  if (/^[a-z]{2,6}$/.test(n) && LAN_MAP[n.toLowerCase()]) return LAN_MAP[n.toLowerCase()];
  return n;
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
