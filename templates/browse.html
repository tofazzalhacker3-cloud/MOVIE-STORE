{% extends "base.html" %}
{% block title %}Browse{% endblock %}
{% block content %}
<div class="page-head">
  <h1 id="pageTitle"><i class="fa-solid fa-compass"></i> Browse <span class="grad">Library</span></h1>
  <p id="pageSub">Discover trending movies, series &amp; anime — filter by category, type, country, year or genre.</p>
</div>

<div class="filter-bar" id="filterBar">
  <div class="seg" id="classifySeg">
    <button data-v="All" class="active">All</button>
    <button data-v="Movie">Movies</button>
    <button data-v="Series">Series</button>
    <button data-v="Anime">Anime</button>
  </div>
  <select class="f-select" id="sortSel">
    <option value="ForYou">For You</option>
    <option value="Hot">Trending</option>
    <option value="Newest">Newest</option>
    <option value="Rating">Top Rated</option>
  </select>
  <select class="f-select" id="countrySel">
    <option value="All">All Countries</option>
    <option value="India">India</option>
    <option value="United States">USA</option>
    <option value="South Korea">South Korea</option>
    <option value="Japan">Japan</option>
    <option value="China">China</option>
    <option value="United Kingdom">UK</option>
    <option value="France">France</option>
    <option value="Turkey">Turkey</option>
    <option value="Thailand">Thailand</option>
  </select>
  <select class="f-select" id="yearSel">
    <option value="All">All Years</option>
    <option value="2026">2026</option>
    <option value="2025">2025</option>
    <option value="2024">2024</option>
    <option value="2023">2023</option>
    <option value="2022">2022</option>
    <option value="2021">2021</option>
    <option value="2020">2020</option>
    <option value="2019">2019</option>
    <option value="2018">2018</option>
    <option value="2015">2015</option>
    <option value="2010">2010</option>
  </select>
  <select class="f-select" id="genreSel">
    <option value="All">All Genres</option>
    <option value="Action">Action</option>
    <option value="Adventure">Adventure</option>
    <option value="Animation">Animation</option>
    <option value="Comedy">Comedy</option>
    <option value="Crime">Crime</option>
    <option value="Documentary">Documentary</option>
    <option value="Drama">Drama</option>
    <option value="Fantasy">Fantasy</option>
    <option value="Horror">Horror</option>
    <option value="Mystery">Mystery</option>
    <option value="Romance">Romance</option>
    <option value="Sci-Fi">Sci-Fi</option>
    <option value="Thriller">Thriller</option>
    <option value="War">War</option>
  </select>
</div>

<div class="season-tabs" id="catTabs"></div>
<div id="grid" class="row"></div>
<div class="inf-scroll" id="infScroll">
  <div class="inf-spinner hide" id="infSpinner"><div class="spinner"></div></div>
</div>
<div id="sentinel"></div>
{% endblock %}
{% block scripts %}
<script>
const cats = {{ categories | tojson }};
const params = new URLSearchParams(location.search);
const CAT_ICONS = { "Trending": "fa-fire", "Trending in Cinema": "fa-film", "Bollywood": "fa-star", "South Indian": "fa-mask", "Hollywood": "fa-hollywood-berrie", "Top Series This Week": "fa-tv", "Anime": "fa-wand-magic-sparkles", "Reality TV": "fa-clapperboard" };
const MODE = params.get("category") ? "category" : "channel";
let channel = params.get("channelId") || "1|1";
let category = params.get("category") || null;
let page = 1, loading = false, hasMore = true, loaded = 0;
let seen = new Set();
let filters = { classify: "All", sort: "ForYou", country: "All", year: "All", genre: "All" };

if (MODE === "category") {
  const name = Object.entries(cats).find(([, id]) => id === category);
  document.getElementById("pageTitle").innerHTML = `<i class="fa-solid fa-fire"></i> ${name ? name[0] : "Category"} <span class="grad">See All</span>`;
  document.getElementById("pageSub").textContent = "All titles in this category — scroll to load more.";
  document.getElementById("filterBar").style.display = "none";
  document.getElementById("catTabs").style.display = "none";
} else {
  buildTabs();
  bindFilters();
}

function buildTabs() {
  const box = document.getElementById("catTabs");
  box.innerHTML = Object.entries(cats).map(([name, id]) =>
    `<button class="season-tab ${id === channel ? "active" : ""}" onclick="pickCat('${id}')">
      <i class="fa-solid ${CAT_ICONS[name] || "fa-film"}"></i> ${name}
    </button>`).join("");
}

window.pickCat = (id) => { channel = id; page = 1; hasMore = true; loaded = 0; seen = new Set(); buildTabs(); resetGrid(); loadPage(); };

function bindFilters() {
  document.querySelectorAll("#classifySeg button").forEach(b => {
    b.onclick = () => {
      document.querySelectorAll("#classifySeg button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      filters.classify = b.dataset.v; page = 1; hasMore = true; loaded = 0; seen = new Set(); resetGrid(); loadPage();
    };
  });
  [["sortSel", "sort"], ["countrySel", "country"], ["yearSel", "year"], ["genreSel", "genre"]].forEach(([id, key]) => {
    document.getElementById(id).onchange = (e) => { filters[key] = e.target.value; page = 1; hasMore = true; loaded = 0; seen = new Set(); resetGrid(); loadPage(); };
  });
}

function resetGrid() {
  document.getElementById("grid").innerHTML = skeletonRow();
  document.getElementById("infSpinner").classList.add("hide");
}

async function loadPage() {
  if (loading || !hasMore) return;
  loading = true;
  document.getElementById("infSpinner").classList.remove("hide");
  try {
    const q = MODE === "category"
      ? new URLSearchParams({ category, page, perPage: 20 })
      : new URLSearchParams({ channelId: channel, page, perPage: 20, ...filters });
    const d = await api(`/${MODE === "category" ? "home" : "list"}?${q.toString()}`);
    const items = (d.items || []).filter(it => {
      const k = it.id;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
    const grid = document.getElementById("grid");
    grid.querySelectorAll(".skel").forEach(s => s.remove());
    grid.insertAdjacentHTML("beforeend", items.map((it, i) => cardHtml(it, loaded + i)).join(""));
    loaded += items.length;
    const pagerHasMore = d.pager ? d.pager.hasMore !== false : items.length > 0;
    hasMore = pagerHasMore && items.length > 0;
    page++;
  } catch (e) {
    const grid = document.getElementById("grid");
    if (!grid.querySelector(".card"))
      grid.innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><br>Failed to load</div>';
  } finally {
    loading = false;
    document.getElementById("infSpinner").classList.add("hide");
  }
}

const observer = new IntersectionObserver((entries) => {
  if (entries[0].isIntersecting) loadPage();
}, { rootMargin: "600px" });
observer.observe(document.getElementById("sentinel"));

loadPage();
document.getElementById("navSearchBtn").addEventListener("click", () => {
  const q = document.getElementById("navSearch").value.trim();
  if (q) location.href = "/search?q=" + encodeURIComponent(q);
});
document.getElementById("navSearch").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("navSearchBtn").click();
});
</script>
{% endblock %}
