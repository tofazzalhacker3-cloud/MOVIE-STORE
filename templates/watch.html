{% extends "base.html" %}
{% block title %}Watch{% endblock %}
{% block content %}
<div id="watchRoot">
  <div class="player-wrap">
    <div id="playerSkel" class="skel skel-player"></div>
    <div class="player-load hide" id="playerLoad"><div class="spinner"></div><span>Loading</span></div>
    <video id="video" class="hide" playsinline controls></video>
  </div>
  <div id="hevcNotice" class="notice" style="display:none;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:#fcd34d;padding:10px 16px;border-radius:10px;margin-bottom:14px;font-size:.85rem;line-height:1.5">
    <i class="fa-solid fa-triangle-exclamation"></i> This video is <b>HEVC (H.265)</b> — your browser can't decode this format.
    Video na chalale <b>Download</b> kore VLC / MX Player diye dekhen (Safari te chole).
  </div>
  <div id="watchMeta" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:26px">
    <div>
      <div id="titleSkel" style="width:55%;max-width:520px"><div class="skel skel-line" style="height:30px"></div></div>
      <h1 id="wTitle" class="hide" style="font-family:'Outfit';font-weight:900;font-size:1.5rem"></h1>
      <div id="wSub" style="color:var(--muted);font-size:.88rem;margin-top:4px"></div>
    </div>
    <div class="detail-actions">
      <button class="btn btn-download btn-icon" id="dlBtn" onclick="openDl()"><i class="fa-solid fa-cloud-arrow-down"></i> Download</button>
      <button class="btn btn-nav btn-icon" id="prevEpBtn" style="display:none" onclick="navEp(-1)"><i class="fa-solid fa-backward-step"></i> Prev</button>
      <button class="btn btn-nav btn-icon" id="nextEpBtn" style="display:none" onclick="navEp(1)">Next <i class="fa-solid fa-forward-step"></i></button>
    </div>
  </div>
  <div id="watchEps"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
const SID = {{ subject_id | tojson }};
const P = new URLSearchParams(location.search);
let DUB = P.get("dub") || SID;
const SE = parseInt(P.get("se") || "0", 10);
const EP = parseInt(P.get("ep") || "0", 10);
let PLAYER = null, CURRENT_STREAM = null, SEASONS_DATA = null, DETAIL = null;
let currentSe = SE, currentEp = EP;

async function loadData() {
  try {
    DETAIL = await api(`/details/${SID}`);
    let dubs = DETAIL.dubs || [];
    try { dubs = (await api(`/dub-info/${SID}`)) || dubs; } catch (e) {}
    const dub = dubs.find(x => x.subjectId === DUB);
    document.getElementById("wTitle").textContent = (dub ? dubName(dub) + " • " : "") + (DETAIL.title || "Untitled");
    document.getElementById("wTitle").classList.remove("hide");
    document.getElementById("titleSkel").remove();
    document.title = (DETAIL.title || "MOVIESTORE") + " | MOVIESTORE";
    buildSub();
    if (DETAIL.type === 2) {
      SEASONS_DATA = await api(`/seasons/${DUB}`);
      const seasons = SEASONS_DATA.seasons || [];
      if (!currentSe || !currentEp || !seasons.some(s => s.se === currentSe)) {
        const s0 = seasons[0];
        if (s0) { currentSe = s0.se; currentEp = 1; }
      }
      document.getElementById("prevEpBtn").style.display = "";
      document.getElementById("nextEpBtn").style.display = "";
      renderEps();
      updateNavBtns();
    }
  } catch (e) {
    document.getElementById("wTitle").textContent = "Failed to load: " + e.message;
  }
}

function buildSub() {
  const el = document.getElementById("wSub");
  let s = (DETAIL && DETAIL.releaseDate || "").slice(0, 4);
  if (DETAIL && DETAIL.genre) s += " &bull; " + DETAIL.genre.split(",").slice(0, 3).join(", ");
  if (DETAIL && DETAIL.imdbRating) s += ` &bull; <i class="fa-solid fa-star" style="color:#fbbf24"></i> ${DETAIL.imdbRating}`;
  if (DETAIL && DETAIL.duration) s += ` &bull; ${DETAIL.duration}`;
  if (DETAIL && DETAIL.type === 2) s += ` &bull; <span class="ep-badge">S${currentSe} E${currentEp}</span>`;
  el.innerHTML = s;
}

function updateNavBtns() {
  const seasons = (SEASONS_DATA && SEASONS_DATA.seasons) || [];
  const cur = seasons.find(s => s.se === currentSe);
  const idx = seasons.indexOf(cur);
  const maxEp = cur ? cur.maxEp : 1;
  const hasPrev = currentEp > 1 || idx > 0;
  const hasNext = currentEp < maxEp || (idx >= 0 && idx < seasons.length - 1);
  document.getElementById("prevEpBtn").style.display = hasPrev ? "" : "none";
  document.getElementById("nextEpBtn").style.display = hasNext ? "" : "none";
}

function renderEps() {
  const area = document.getElementById("watchEps");
  const seasons = (SEASONS_DATA && SEASONS_DATA.seasons) || [];
  if (!seasons.length) { area.innerHTML = ""; return; }
  area.innerHTML =
    '<div class="season-tabs">' + seasons.map(s =>
      `<button class="season-tab ${s.se === currentSe ? "active" : ""}" onclick="pickEpSeason(this, ${s.se})">Season ${s.se}</button>`).join("") +
    '</div><div id="watchEpGrid" class="ep-grid"></div>';
  renderEpGrid();
}

function renderEpGrid() {
  const grid = document.getElementById("watchEpGrid");
  if (!grid) return;
  const season = ((SEASONS_DATA && SEASONS_DATA.seasons) || []).find(s => s.se === currentSe) || {};
  const maxEp = season.maxEp || 0;
  grid.innerHTML = Array.from({ length: maxEp }, (_, i) => i + 1).map(ep =>
    `<button class="ep ${ep === currentEp ? "active" : ""}" onclick="goEp(${ep})">
      <div class="ep-num">EPISODE ${String(ep).padStart(2, "0")}</div>
      <div class="ep-title">Episode ${ep}</div>
    </button>`).join("");
}

window.pickEpSeason = (btn, se) => {
  currentSe = se;
  if (!currentEp) currentEp = 1;
  document.querySelectorAll("#watchEps .season-tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderEpGrid();
  buildSub();
  updateNavBtns();
  refresh();
};

window.goEp = (ep) => {
  currentEp = ep;
  renderEpGrid();
  buildSub();
  updateNavBtns();
  refresh();
};

function streamFromData(d) {
  const streams = d.streams || [];
  if (!streams.length) return null;
  let best = streams[0];
  for (const s of streams) {
    const r1 = best.resolutions || "", r2 = s.resolutions || "";
    if (parseInt(r2, 10) > parseInt(r1, 10)) best = s;
  }
  let url = best.url || "";
  let cookie = best.signCookie || "";
  if (!url) {
    for (const det of (best.resourceDetectors || [])) {
      const vids = det.resolutionList || [];
      if (vids.length) { url = vids[0].resourceLink; break; }
    }
  }
  return { stream: best, url, cookie };
}

async function loadStream() {
  const d = await api(`/streams/${DUB}?se=${currentSe}&ep=${currentEp}`);
  const { stream, url, cookie } = streamFromData(d);
  if (!url) {
    const sk = document.getElementById("playerSkel");
    if (sk) sk.remove();
    document.getElementById("video").classList.remove("hide");
    document.getElementById("wSub").innerHTML += " &bull; <span style='color:#f87171'>No stream available</span>";
    return;
  }
  CURRENT_STREAM = { stream, url, cookie };
  const fmt = (stream.format || "").toUpperCase();
  const proxiedUrl = "/proxy?url=" + encodeURIComponent(url) + "&cookie=" + encodeURIComponent(cookie || "");
  const video = document.getElementById("video");
  const sk = document.getElementById("playerSkel");
  if (sk) sk.remove();
  video.classList.remove("hide");
  const isDash = fmt.includes("DASH") || url.includes(".mpd");
  const isHls = fmt.includes("HLS") || url.includes(".m3u8") || url.includes("m3u8");
  const isHevc = /h265|hev1|hvc1/.test((url + " " + (stream.codec || "") + " " + (stream.resolutions || "")));

  if (isHevc && video.canPlayType && !video.canPlayType('video/mp4; codecs="hev1.1.6.L93.90"')) {
    document.getElementById("hevcNotice").style.display = "";
    document.getElementById("dlBtn").style.display = "";
  }

  if (isDash && window.dashjs && dashjs.supportsMediaSource()) {
    window.DASH = dashjs.MediaPlayer().create().initialize(video, proxiedUrl, true);
  } else if (isHls && window.Hls && Hls.isSupported()) {
    const hls = new Hls({ maxBufferLength: 40 });
    hls.loadSource(proxiedUrl);
    hls.attachMedia(video);
  } else {
    video.src = proxiedUrl;
  }

  addCaptions();
  PLAYER = new Plyr(video, {
    controls: ["play-large", "restart", "rewind", "play", "fast-forward", "progress", "current-time", "duration", "mute", "volume", "captions", "settings", "pip", "airplay", "fullscreen"],
    captions: { active: true, language: "en", update: true },
    keyboard: { focused: true, global: true },
    tooltips: { controls: true, seek: true },
  });
  loadDownloadLink();
  initDubButton(PLAYER);
  initQualityButton(PLAYER);
  const loadEl = document.getElementById("playerLoad");
  ["loadstart", "waiting", "seeking"].forEach(ev => video.addEventListener(ev, () => loadEl.classList.remove("hide")));
  ["playing", "canplay", "loadeddata", "error", "stalled", "abort"].forEach(ev => video.addEventListener(ev, () => loadEl.classList.add("hide")));
  video.addEventListener("loadedmetadata", () => {
    toast((fmt || "video") + " • " + (stream.resolutions || "auto") + "p ready");
  });
}

async function addCaptions() {
  const video = document.getElementById("video");
  const streamId = CURRENT_STREAM.stream.id;
  try {
    const caps = await api(`/captions/${DUB}?streamId=${encodeURIComponent(streamId)}`);
    const added = new Set();
    for (const c of caps) {
      const lang = c.lanCode || c.lan || "en";
      if (added.has(lang)) continue;
      added.add(lang);
      const tr = document.createElement("track");
      tr.kind = "captions"; tr.label = c.lanName || lang; tr.srclang = lang;
      tr.src = "/cap?url=" + encodeURIComponent(c.url);
      video.appendChild(tr);
    }
    if (PLAYER) PLAYER.captions.setup();
  } catch (e) { /* captions optional */ }
}

window.loadDownloadLink = async () => {
  const isTv = DETAIL && DETAIL.type === 2;
  const se = isTv ? currentSe : 1, ep = isTv ? currentEp : 1;
  try {
    const url = isTv
      ? `/resource/${DUB}?all=1&se=${se}&epFrom=${ep}&epTo=${ep}`
      : `/resource/${DUB}?all=0`;
    const d = await api(url);
    const r = (d.resources || []).find(x => x.resourceLink);
    if (r && PLAYER) {
      PLAYER.download = "/download?url=" + encodeURIComponent(r.resourceLink) +
        "&name=" + encodeURIComponent((r.title || "movie") + ".mp4");
    }
  } catch (e) { /* download optional */ }
};

window.openDl = () => {
  const isTv = DETAIL && DETAIL.type === 2;
  const se = isTv ? currentSe : 1, ep = isTv ? currentEp : 1;
  openModal('<h3><i class="fa-solid fa-cloud-arrow-down" style="color:var(--grad2)"></i> Download</h3><div class="modal-sub">Fetching available qualities...</div><div style="text-align:center;padding:20px"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;color:var(--grad1)"></i></div>');
  (async () => {
    try {
      const url = isTv
        ? `/resource/${DUB}?all=1&se=${se}&epFrom=${ep}&epTo=${ep}`
        : `/resource/${DUB}?all=0`;
      const d = await api(url);
      const list = d.resources || [];
      document.getElementById("modalContent").innerHTML = list.length
        ? '<h3><i class="fa-solid fa-cloud-arrow-down" style="color:var(--grad2)"></i> Download</h3><div class="modal-sub">' + list.length + ' file(s) — direct MP4</div>' +
          list.map(r => `<div class="dl-item">
            <div class="dl-icon"><i class="fa-solid fa-file-video"></i></div>
            <div class="dl-mid">
              <div class="dl-title">${r.title || r.resolution + "P"}</div>
              <div class="dl-sub">${r.resolution}P &bull; ${fmtBytes(r.size)} &bull; ${r.codecName || "video"}</div>
            </div>
            <div class="dl-btns">
              <button class="icon-btn" title="Copy" onclick="copyLink('${r.resourceLink}')"><i class="fa-solid fa-link"></i></button>
              <button class="icon-btn" title="Download" onclick="downloadFile('${r.resourceLink}','${(r.title || "movie") + ".mp4"}')"><i class="fa-solid fa-download"></i></button>
            </div></div>`).join("")
        : '<h3>Download</h3><div class="empty"><i class="fa-solid fa-cloud-arrow-down"></i><br>No downloadable resources</div>';
    } catch (e) {
      document.getElementById("modalContent").innerHTML = '<h3>Download</h3><div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><br>' + e.message + '</div>';
    }
  })();
};
window.copyLink = async (u) => {
  try { await navigator.clipboard.writeText(u); toast("Link copied!"); }
  catch { prompt("Copy link:", u); }
};
window.downloadFile = (u, name) => {
  location.href = "/download?url=" + encodeURIComponent(u) + "&name=" + encodeURIComponent(name || "video.mp4");
  toast("Download started via server...");
};

window.switchDubPlayer = async (sid) => {
  if (sid === DUB || !sid) return;
  DUB = sid;
  closeDubMenu();
  document.getElementById("wTitle").textContent =
    (dubName((DETAIL && DETAIL.dubs || []).find(x => x.subjectId === DUB)) || "") + " • " + (DETAIL ? DETAIL.title : "Untitled");
  try { SEASONS_DATA = await api(`/seasons/${DUB}`); } catch (e) {}
  const seasons = (SEASONS_DATA && SEASONS_DATA.seasons) || [];
  if (!seasons.some(s => s.se === currentSe)) {
    const s0 = seasons[0];
    if (s0) { currentSe = s0.se; currentEp = 1; }
  }
  const list = document.getElementById("dubMenuList");
  if (list) list.dataset.loaded = "";
  renderEps();
  buildSub();
  updateNavBtns();
  toast("Audio: " + (dubName((DETAIL.dubs || []).find(x => x.subjectId === DUB)) || ""));
  refresh();
};

function closeDubMenu() {
  document.querySelectorAll(".plyr-dub-menu, .plyr-qual-menu").forEach(m => {
    m.classList.remove("show");
    m.classList.add("hide");
  });
}
if (!window.__dubDocBound) {
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".plyr-dub, .plyr-qual")) closeDubMenu();
  });
  window.__dubDocBound = true;
}

let QUAL_IDX = -1;

function buildQualList() {
  const list = document.getElementById("qualMenuList");
  const bits = window.DASH ? (DASH.getBitrateInfoListFor("video") || []) : [];
  const cur = window.DASH ? DASH.getQualityFor("video") : -1;
  const isAuto = window.DASH ? DASH.getAutoSwitchQualityFor("video") === cur : true;
  const sorted = [...bits].map((b, i) => ({ q: i, label: b.height ? b.height + "p" : Math.round((b.bitrate || 0) / 1000) + " kbps" }))
    .sort((a, b) => b.q - a.q);
  const opts = [{ q: -1, label: "Auto" }].concat(sorted);
  list.innerHTML = opts.map(o =>
    `<button class="plyr-dub-item ${(o.q < 0 ? isAuto : cur === o.q) ? "active" : ""}" data-q="${o.q}">${o.label}</button>`).join("");
}

function initQualityButton(player) {
  const controls = player.elements.controls;
  const holder = document.createElement("div");
  holder.className = "plyr-qual";
  holder.innerHTML = `
    <button type="button" class="plyr__control" aria-label="Video quality">
      <i class="fa-solid fa-gauge-high"></i>
      <span class="plyr__tooltip">Quality</span>
    </button>
    <div class="plyr-qual-menu hide">
      <div class="plyr-dub-title">Video Quality</div>
      <div id="qualMenuList"></div>
    </div>`;
  const anchor = controls.querySelector(".plyr__control[data-plyr=settings]");
  if (anchor && anchor.parentNode) controls.insertBefore(holder, anchor.parentNode);
  else controls.appendChild(holder);
  const btn = holder.querySelector("button");
  const menu = holder.querySelector(".plyr-qual-menu");
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (menu.classList.contains("show")) { closeDubMenu(); return; }
    closeDubMenu();
    menu.classList.remove("hide");
    buildQualList();
    menu.classList.add("show");
  });
  menu.addEventListener("click", (e) => {
    const it = e.target.closest(".plyr-dub-item");
    if (!it) return;
    QUAL_IDX = parseInt(it.dataset.q, 10);
    if (window.DASH) {
      try {
        if (QUAL_IDX < 0) DASH.setQualityFor("video", DASH.getAutoSwitchQualityFor("video"));
        else DASH.setQualityFor("video", QUAL_IDX);
      } catch (err) { toast("Quality switch failed", false); }
    }
    closeDubMenu();
    toast("Quality: " + (QUAL_IDX < 0 ? "Auto" : it.textContent.trim()));
  });
}

function initDubButton(player) {
  const controls = player.elements.controls;
  const holder = document.createElement("div");
  holder.className = "plyr-dub";
  holder.innerHTML = `
    <button type="button" class="plyr__control" aria-label="Audio language">
      <i class="fa-solid fa-language"></i>
      <span class="plyr__tooltip">Audio</span>
    </button>
    <div class="plyr-dub-menu hide">
      <div class="plyr-dub-title">Audio Language</div>
      <div id="dubMenuList"></div>
    </div>`;
  const anchor = controls.querySelector(".plyr__control[data-plyr=settings]");
  if (anchor && anchor.parentNode) controls.insertBefore(holder, anchor.parentNode);
  else controls.appendChild(holder);
  const btn = holder.querySelector("button");
  const menu = holder.querySelector(".plyr-dub-menu");
  btn.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (menu.classList.contains("show")) { closeDubMenu(); return; }
    closeDubMenu();
    menu.classList.remove("hide");
    const list = document.getElementById("dubMenuList");
    if (!list.dataset.loaded) {
      list.innerHTML = Array.from({ length: 4 }, () =>
        '<div class="skel skel-line" style="height:28px"></div>').join("");
      let dubs = (DETAIL && DETAIL.dubs) || [];
      try { dubs = (await api(`/dub-info/${SID}`)) || dubs; } catch (err) {}
      dubs.sort((a, b) => ((b.original ? 1 : 0) - (a.original ? 1 : 0)) ||
        (a.lanName || "").localeCompare(b.lanName || ""));
      list.innerHTML = dubs.map(d =>
        `<button class="plyr-dub-item ${d.subjectId === DUB ? "active" : ""}" data-sid="${d.subjectId}">${dubName(d)}</button>`).join("");
      list.dataset.loaded = "1";
    }
    menu.classList.add("show");
  });
  menu.addEventListener("click", (e) => {
    const it = e.target.closest(".plyr-dub-item");
    if (it) { switchDubPlayer(it.dataset.sid); }
  });
}

function refresh() {
  if (PLAYER) { try { PLAYER.destroy(); } catch (e) {} PLAYER = null; }
  if (window.DASH) { try { DASH.destroy(); } catch (e) {} DASH = null; }
  const video = document.getElementById("video");
  video.removeAttribute("src");
  while (video.querySelectorAll("track").length) video.querySelector("track").remove();
  buildSub();
  loadStream();
}

window.navEp = (dir) => {
  const seasons = SEASONS_DATA.seasons || [];
  const cur = seasons.find(s => s.se === currentSe);
  if (!cur) return;
  const maxEp = cur.maxEp || 1;
  let ns = currentEp + dir;
  if (ns < 1 || ns > maxEp) {
    const idx = seasons.indexOf(cur);
    const nxt = seasons[idx + dir];
    if (!nxt) { toast("End of series", false); return; }
    currentSe = nxt.se;
    currentEp = dir > 0 ? 1 : nxt.maxEp;
  } else {
    currentEp = ns;
  }
  renderEpGrid();
  buildSub();
  updateNavBtns();
  refresh();
};

(async () => {
  await loadData();
  await refresh();
})();
document.getElementById("navSearchBtn").addEventListener("click", () => {
  const q = document.getElementById("navSearch").value.trim();
  if (q) location.href = "/search?q=" + encodeURIComponent(q);
});
document.getElementById("navSearch").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("navSearchBtn").click();
});
</script>
{% endblock %}
