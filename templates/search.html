{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block content %}
<div class="row-title"><i class="fa-solid fa-magnifying-glass" style="color:var(--grad2)"></i> Results for <span class="grad">&ldquo;{{ query }}&rdquo;</span></div>
<div id="grid" class="row"></div>
{% endblock %}
{% block scripts %}
<script>
const Q = {{ query | tojson }};
(async () => {
  const grid = document.getElementById("grid");
  grid.innerHTML = skeletonRow();
  try {
    const d = await api(`/search?q=${encodeURIComponent(Q)}`);
    grid.innerHTML = d.items.map((it, i) => cardHtml(it, i)).join("") || '<div class="empty"><i class="fa-solid fa-film"></i><br>No results found for "' + Q + '"</div>';
  } catch (e) {
    grid.innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><br>Search failed</div>';
  }
})();
document.getElementById("navSearch").value = Q;
document.getElementById("navSearchBtn").addEventListener("click", () => {
  const q = document.getElementById("navSearch").value.trim();
  if (q) location.href = "/search?q=" + encodeURIComponent(q);
});
document.getElementById("navSearch").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("navSearchBtn").click();
});
</script>
{% endblock %}
